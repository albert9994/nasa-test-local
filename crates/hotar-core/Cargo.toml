[package]
name = "hotar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hotar core engine: daily crop/soil-water simulator, stress tests, optimizer, rules, score, quant and fact sheet"

[features]
default = ["parallel"]
# rayon for frontier / optimize / quant on native targets (never enabled for wasm32)
parallel = ["dep:rayon"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
once_cell = { workspace = true }
rhai = { workspace = true }
rayon = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rhai = { workspace = true, features = ["no_time", "wasm-bindgen"] }
