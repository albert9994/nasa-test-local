[workspace]
resolver = "2"
members = [
    "crates/fieldshift-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"
rhai = { version = "1.19", features = ["sync", "serde"] }
