[workspace]
resolver = "2"
members = [
    "crates/fieldshift-core",
    "crates/fieldshift-wasm",
    "crates/fieldshift-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["FieldShift Team (Albert, Moldo, Luca, Ionut, Octa)"]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
anyhow = "1.0.102"
rand = "0.9.2"
rand_chacha = "0.9.0"
tokio = { version = "1.50.0", features = ["full"] }
bytes = "1.11.1"
lru = "0.12.5"
parking_lot = "0.12.5"
once_cell = "1.21.4"
chrono = "0.4.44"
log = "0.4.29"
indexmap = "2.13.0"
itertools = "0.13.0"
fieldshift-core = { path = "crates/fieldshift-core" }
