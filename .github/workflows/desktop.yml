name: Desktop installers

# Builds the Hotar desktop app (Tauri 2) for macOS and Windows. Unsigned for now.
# Trigger: push a tag like v2.2.0 (builds, then publishes the GitHub release as latest), or run it by hand from the
# Actions tab (workflow artifacts only).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact: macos-dmg
            glob: "apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact: macos-intel-dmg
            glob: "apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg"
          - os: windows-latest
            args: ""
            rust_targets: ""
            artifact: windows-installers
            glob: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # the native Rust engine (cargo feature native-engine) is on by default
          args: ${{ matrix.args }}
          # Release assets only on tags; manual runs just upload workflow artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Hotar {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  # On tags: attach version-free copies (the website links to releases/latest/download/<name>) and publish the release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Stable names
        run: |
          set -euo pipefail
          mkdir stable
          one() { f=$(find dist/$1 -type f -name "$2" | head -1); [ -n "$f" ] || { echo "missing $1/$2"; exit 1; }; cp "$f" "stable/$3"; }
          one macos-dmg          "*aarch64*.dmg" Hotar-mac-apple-silicon.dmg
          one macos-intel-dmg    "*x64*.dmg"     Hotar-mac-intel.dmg
          one windows-installers "*-setup.exe"   Hotar-windows-setup.exe
          one windows-installers "*.msi"         Hotar-windows.msi
          ls -l stable
      - name: Upload and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.ref_name }}" stable/* --clobber
          gh release edit "${{ github.ref_name }}" --draft=false --prerelease=false --latest
