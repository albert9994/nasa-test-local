name: Desktop installers

# Builds the Hotar desktop app (Tauri 2) for macOS and Windows. Unsigned for now.
# Trigger: push a tag like v0.1.0, or run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact: macos-dmg
            glob: "apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            artifact: macos-intel-dmg
            glob: "apps/desktop/src-tauri/target/**/release/bundle/dmg/*.dmg"
          - os: windows-latest
            args: ""
            rust_targets: ""
            artifact: windows-installers
            glob: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # the native Rust engine (cargo feature native-engine) is on by default
          args: ${{ matrix.args }}
          # Release assets only on tags; manual runs just upload workflow artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Hotar {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: true

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
