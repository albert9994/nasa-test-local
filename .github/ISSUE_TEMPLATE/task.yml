name: Task
description: Un task din planul echipei (docs/team)
title: "<ID>: "
labels: ["task"]
body:
  - type: textarea
    id: what
    attributes: { label: Ce trebuie făcut, description: "Copiat din docs/team/<NUME>.md" }
    validations: { required: true }
  - type: input
    id: needs
    attributes: { label: Are nevoie de (task-uri înainte), placeholder: "ex. A8, M3" }
  - type: input
    id: done
    attributes: { label: Gata când, placeholder: "criteriul de 'done'" }
  - type: input
    id: unblocks
    attributes: { label: Deblochează, placeholder: "ex. I3, O3" }
