[package]
name = "fieldshift-mobile"
version = "2.0.1"
description = "FieldShift mobile app (Tauri 2, iOS + Android)"
edition = "2021"
rust-version = "1.77"
publish = false

# Not part of the repository's root cargo workspace (crates/*): the mobile app is built by `tauri ios|android build`.
[workspace]

[lib]
# Mobile targets load the app as a library (staticlib on iOS, cdylib on Android).
name = "fieldshift_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native engine: the same commands as the desktop app (src/lib.rs includes apps/desktop/src-tauri/src/native.rs).
fieldshift-core = { path = "../../../crates/fieldshift-core", optional = true }

[features]
default = ["native-engine"]
native-engine = ["dep:fieldshift-core"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
