[package]
name = "fieldshift-desktop"
version = "0.1.0"
description = "FieldShift desktop app (Tauri 2)"
edition = "2021"
rust-version = "1.77"
publish = false

# Not part of the repository's root cargo workspace (crates/*): the desktop app is built by `tauri build`.
[workspace]

[lib]
name = "fieldshift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native engine: the same Engine contract as the TypeScript engine, computed by fieldshift-core in Rust.
# Off by default. To switch it on (see apps/desktop/README.md):
#   1. uncomment the fieldshift-core line below once crates/fieldshift-core exists,
#   2. build with `--features native-engine` (e.g. `pnpm --filter desktop tauri build -- --features native-engine`).
# (Cargo needs the path to exist even for an optional dependency, so it stays commented until the crate lands.)
# fieldshift-core = { path = "../../../crates/fieldshift-core", optional = true }

[features]
default = []
native-engine = []
# native-engine = ["dep:fieldshift-core"]   # <- use this line instead of the one above when fieldshift-core is enabled

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
