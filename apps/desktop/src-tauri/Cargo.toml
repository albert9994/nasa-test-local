[package]
name = "hotar-desktop"
version = "2.2.0"
description = "Hotar desktop app (Tauri 2)"
edition = "2021"
rust-version = "1.77"
publish = false

# Not part of the repository's root cargo workspace (crates/*): the desktop app is built by `tauri build`.
[workspace]

[lib]
name = "hotar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native engine: the same Engine contract as the TypeScript/WASM engine, computed by hotar-core in Rust (rayon on).
# On by default; `--no-default-features` builds the shell without it (the UI then keeps the TypeScript engine).
hotar-core = { path = "../../../crates/hotar-core", optional = true }

# Local AI advisor: the Hotar API (crates/hotar-server) runs inside the app on 127.0.0.1 when an LLM is configured in
# ~/.hotar/ai.env (or the LLM_* environment variables). The key stays on this computer; it is never compiled in.
hotar-server = { path = "../../../crates/hotar-server", optional = true }

[features]
default = ["native-engine", "ai-server"]
native-engine = ["dep:hotar-core"]
ai-server = ["dep:hotar-server"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
